name: Dependency Review

# Runs GitHub's Dependency Review Action on every PR against main.
# The action diffs the PR's dependency graph against the base branch and
# fails the check when the PR introduces a dependency with a known
# vulnerability at or above the configured severity threshold.
#
# This is the PR-time gate. Weekly Dependabot PRs (see .github/dependabot.yml)
# handle the *maintenance* side — fixing known vulnerabilities in the current
# graph. Together they cover "don't land new CVEs" + "fix existing CVEs."
#
# Reference:
# https://docs.github.com/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review

# Forked-PR limitation: GitHub strips `pull-requests: write` from
# workflows triggered by `pull_request` events from forks (security —
# a malicious fork would otherwise be able to write to the PR). That
# means `comment-summary-in-pr` below does NOT post a comment when
# the PR originates from a fork. The failure itself is still
# enforced — the workflow still fails the check — but reviewers have
# to open the Actions log to see *why*. If fork-PR comments ever
# become a hard requirement, the standard workaround is the two-
# workflow pattern: keep this `pull_request` workflow for the check,
# and add a companion `workflow_run` workflow (triggered on this
# workflow's completion) that has the write scope and posts the
# comment. See:
#   https://docs.github.com/en/actions/reference/events-that-trigger-workflows#workflow_run
#   https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
on:
  pull_request:
    branches: ['main']

# Default to read-only at the workflow level; the job below upgrades
# only the scopes it actually needs (this is the principle of least
# privilege for GHA token scopes).
permissions:
  contents: read

# Cancel superseded runs on the same PR. A push that adds a new commit
# supersedes the prior review — the latest commit's dependency diff is
# what reviewers act on, so finishing the older run wastes compute.
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required by `comment-summary-in-pr: on-failure` below. GitHub auto-downgrades this to read-only for forked-PR runs, so the comment post silently no-ops on forks.
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Drop GITHUB_TOKEN from .git/config after checkout. The
          # dependency-review action reads the dependency graph diff
          # over the GitHub API using the workflow's job-level token —
          # it never needs git credentials attached to the working tree.
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail the PR when any newly introduced dependency has a known
          # vulnerability at `moderate` or higher. Tighten to `high` if the
          # noise-to-signal ratio is too low in practice; loosen to `low`
          # for a stricter review surface.
          fail-on-severity: moderate
          # Post a human-readable summary as a PR comment so reviewers see
          # the diff without clicking into the Actions log.
          comment-summary-in-pr: on-failure
          # License policy: allowlist of permissive (plus MPL-2.0 weak
          # copyleft) SPDX identifiers safe to bundle into an MIT-licensed
          # library. Any PR-introduced dependency with a license not on
          # this list fails the check. The action upstream deprecated the
          # `deny-licenses` blocklist option (issue 997) because blocklists
          # are unbounded: new copyleft and commercial-restrictive licenses
          # keep appearing, and a missed entry silently passes. The
          # permissive set is finite, explicit, and reviewable.
          #
          # Strong copyleft (GPL, AGPL, LGPL) is intentionally omitted.
          # npm consumers bundle packages statically (via Vite, Webpack,
          # Rollup), so the LGPL dynamic-linking exception that usually
          # makes LGPL safe for applications does NOT apply to bundled JS.
          # MPL-2.0 stays in: its copyleft is file-scoped, not derivative-
          # work-scoped, so it does not contaminate the bundle.
          #
          # Consumers' own license audits remain their responsibility;
          # this is a belt-and-braces check at dependency-introduction time.
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            BlueOak-1.0.0,
            CC-BY-3.0,
            CC-BY-4.0,
            CC0-1.0,
            ISC,
            MIT,
            MIT-0,
            MPL-2.0,
            PostgreSQL,
            Python-2.0,
            Unlicense,
            WTFPL,
            Zlib
          # Per-package carve-out from the license check. This is NOT a change
          # to the allow-list above: strong copyleft stays excluded for every
          # other dependency. sharp's native libvips binaries are
          # LGPL-3.0-or-later (`@img/sharp-libvips-*`), and its win32 / wasm
          # wrappers statically bundle libvips (`Apache-2.0 AND
          # LGPL-3.0-or-later`). The strong-copyleft exclusion above guards
          # against LGPL *JS* a consumer would bundle statically; it does not
          # apply to these. They are native binaries, used only at BUILD time
          # by the docs site (apps/site) for OG-image generation via sharp,
          # never bundled into consumer JS, and absent from the published
          # `attaform` package (zero runtime deps), so they never reach a
          # consumer's install. Pulled in transitively by @nuxtjs/seo's
          # og-image module (see #452). Add new platform purls here if sharp's
          # native platform set changes.
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64
