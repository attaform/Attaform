packages:
  - 'apps/*'

# Settings migrated from package.json#pnpm in the pnpm 10 → 11 bump.
# pnpm 11 no longer reads the `pnpm` field in package.json. See
# https://pnpm.io/settings for the full list of supported keys.
overrides:
  # @nuxt/devtools resolves in apps/site both transitively (via nuxt) and
  # through the root @nuxt/devtools-kit devDep. Two copies each register
  # @vitejs/devtools' runtime client, and the second registration runs
  # against a session the first has already closed, so the panel dies with
  # "Failed to retrieve the current RPC session" (#168). One version means
  # one client and one RPC session.
  #
  # The advisory floor moved with it: GHSA-279x-mwfv-vcqv (critical,
  # unauthenticated DevTools RPC allows arbitrary command execution on the
  # developer's host) is first patched in 3.3.1, and the root spec is
  # ^3.4.2. That floor now lives in package.json, so do not lower it
  # there. Dependabot guards it the same way it guards every other
  # devDependency.
  #
  # This used to be a literal pin, hand-held at "the newest 3.x past the
  # .npmrc cooldown" because setting it to a same-day release made pnpm
  # write a `minimumReleaseAgeExclude` entry and punch a hole in the
  # cooldown gate. The alias does that by itself: a range lets pnpm pick
  # the newest version the cooldown already allows, with nothing to
  # hand-maintain and no exclude entry.
  '@nuxt/devtools': $@nuxt/devtools
  # Types packages are global: two copies of @types/node put two sets of
  # ambient Node declarations into the same program, and `tsc` resolves
  # whichever it reaches first. Bumping the root devDep to ^26 split the
  # tree, because @types/jsdom and chrome-launcher hold the 25 line. Same
  # unifying treatment as the build tools above, tracking the root
  # manifest so a Dependabot bump carries this with it.
  '@types/node': $@types/node
  '@nuxt/kit': $nuxt
  '@nuxt/schema': $nuxt
  # Pin a single rollup so the dev tree never carries two copies. vite and
  # @rollup/plugin-alias float their rollup independently of unbuild's, and
  # when a bump lands them on different 4.x patches, `tsc` sees two distinct
  # `Plugin` / `PluginContext` types (vite augments `PluginContext` with
  # `environment`) and rejects `build.config.ts`'s aliasPlugin against
  # unbuild's plugin array under `exactOptionalPropertyTypes`. One version
  # makes the types identical.
  #
  # `$rollup` tracks the root devDependency, same as vite below, so a
  # bump is an ordinary package.json change and the two stay in lockstep
  # without either being hand-edited here.
  rollup: $rollup
  # Same reasoning one layer up: pin a single vite. The Nuxt ecosystem
  # floats vite independently across @nuxt/content, @nuxt/fonts,
  # @nuxt/icon, @nuxt/devtools-kit and friends, and once a release lands
  # them on two different 8.x minors the dev tree carries both. `tsc`
  # then sees two distinct `UserConfig` types, and comparing the docs
  # site's `vite:` block against the one Nuxt expects overflows the
  # instantiation-depth limit:
  #
  #   nuxt.config.ts(314,16): error TS2321: Excessive stack depth
  #   comparing types '{ modules: ... }' and
  #   'InputConfig<NuxtConfig, ConfigLayerMeta>'
  #
  # The error points at `defineNuxtConfig` and names neither vite nor the
  # offending key, so it reads as a Nuxt or @nuxt/ui problem. It is
  # neither: one vite version makes it go away, two brings it back,
  # independent of the @nuxt/ui major. Verified both directions in a
  # clean-room install while bumping @nuxt/ui to 4.11.1, which is what
  # first floated a second vite into the tree.
  #
  # `$vite` rather than a literal version, unlike rollup below: vite IS
  # a root devDependency, so the root manifest can stay the single
  # source of truth. Every dependent gets rewritten to the spec
  # package.json declares, which is what makes them resolve together.
  # Dependabot then bumps vite the ordinary way and this entry follows,
  # with no hand-edit here and no security patch gated behind one.
  # Every unifying override in this block now works that way.
  # `pnpm check:security-floors` fails if this ever stops deduping.
  vite: $vite
  # Pin devframe's h3 to Nitro's stable v1 line. devframe (transitive of
  # @nuxtjs/seo via @unhead/bundler > @vitejs/devtools-kit) carries a
  # pre-release h3 v2; when Nitro bundles the prerender server, the
  # @nuxt/content sql-dump handler can bind its setResponseHeader to that v2
  # copy and crash on the v1 event Nitro passes it ("Cannot read properties
  # of undefined (reading 'set')"), which on Vercel cascaded into a
  # /sitemap.xml 500. Scoped to devframe so @nuxt/test-utils keeps its own
  # h3 v2 (the h3-next alias) for the e2e suite.
  'devframe>h3': 1.15.11
  # Security floors for dev-only transitive dependencies. Attaform ships
  # zero runtime dependencies (package.json `dependencies` is empty), so
  # none of these reach a consumer install; they harden the build / test /
  # docs toolchain for contributors. Each floor is the first patched
  # version for its advisory, held to the current major so the bump stays a
  # patch/minor rather than a breaking jump. Revisit when the source dep
  # floats past the range on its own and the override becomes a no-op.
  #
  # An override here is a request, not a guarantee: pnpm can record the
  # floor and still leave a locked snapshot on the vulnerable version (see
  # @tiptap/core below). `pnpm check:security-floors` walks the installed
  # tree and fails if any copy sits below its floor; it runs first in
  # `pnpm check`. Trust that gate, not the presence of a line here.
  #
  #   @tiptap/core ^3.30.4
  #                    clears GHSA-cp6q-959q-f8rh (mergeAttributes turns an
  #                    own `__proto__` key into inherited executable DOM
  #                    attributes). Reaches the tree only as a @nuxt/ui
  #                    dependency+peer (demo components) and via @nuxtjs/seo's
  #                    devtools layer; no docs page mounts an editor. The
  #                    floor alone did NOT clear it: @nuxt/ui declares
  #                    @tiptap/core in BOTH `dependencies` and
  #                    `peerDependencies`, and pnpm rewrote the recorded peer
  #                    range while leaving the already-locked snapshot on the
  #                    vulnerable 3.23.6, a version that does not even
  #                    satisfy @nuxt/ui 4.9.0's own declared ^3.26.1, so the
  #                    lockfile was internally inconsistent. `pnpm install`
  #                    reported "Already up to date" and `--force` changed
  #                    nothing. What did work: set this entry to the exact
  #                    version (`'@tiptap/core': 3.31.3`), run `pnpm install`
  #                    to force the cluster to re-resolve, then relax it back
  #                    to the caret floor. The resolution sticks. Use that
  #                    two-step whenever `pnpm check:security-floors` reports
  #                    a violation an override should already have fixed.
  #   brace-expansion@^2 ^2.1.2 / brace-expansion@^5 ^5.0.7
  #                    the same exponential-time `{}` expansion DoS
  #                    (GHSA-3jxr-9vmj-r5cp, high) landed in both majors
  #                    present in the tree, patched separately, hence two
  #                    range-scoped floors rather than one. Pulled by
  #                    minimatch / glob across the lint + test toolchain.
  #   esbuild ^0.28.1  clears GHSA-g7r4-m6w7-qqqr (arbitrary file read via
  #                    the dev server on Windows, real for a Windows
  #                    maintainer, not just a theoretical). Also pins the
  #                    minifier's minor so the eager-bundle bytes stay
  #                    predictable across installs.
  #   fast-uri ^3.1.6  clears four more highs (GHSA-jqff-g426-hqxp and
  #                    -5jgf-p345-68v8, host confusion via percent-encoded
  #                    scheme normalization / skipped IDN canonicalization;
  #                    GHSA-f65p-4m7j-42xc and -fph4-wmhf-6fwf, SSRF via
  #                    malformed IPv6 normalization / repeated hostname
  #                    percent-decoding) on top of the two the ^3.1.5 floor
  #                    answered and the two before that. Pulled by ajv >
  #                    commitlint. 4.x exists but is a breaking major.
  #   fflate ^0.7.5    clears GHSA-px8p-9vwx-vf98 (infinite loop in
  #                    unzipSync on a malformed ZIP64 archive). Held to
  #                    0.7.x: the only consumer, satori's opentype.js fork,
  #                    declares ^0.7.3, and the patch landed in that line.
  #                    Satori renders OG images from this repo's own
  #                    templates at prerender time, so no attacker-supplied
  #                    archive reaches it.
  #   fast-xml-parser ^5.10.1
  #                    clears GHSA-8r6m-32jq-jx6q (high, repeated DOCTYPE
  #                    declarations reset entity expansion limits).
  #   js-yaml ^4.3.2   clears GHSA-2883-xcg3-v3hh (high, `maxTotalMergeKeys`
  #                    does not count empty mappings, so repeatedly merging
  #                    a long sequence of them costs O(N*K) CPU without ever
  #                    reaching the configured limit) on top of
  #                    GHSA-h67p-54hq-rp68 and -52cp-r559-cp3m (both
  #                    quadratic CPU via merge-key chains) and
  #                    -5p4m-2wfm-xmqj (high, quadratic CPU in !!omap
  #                    resolution) that the ^4.3.1 floor answered. Pulled by
  #                    @nuxt/content's JSON-schema ref parser (docs site).
  #   postcss ^8.5.23  clears GHSA-r28c-9q8g-f849 and its incomplete-fix
  #                    follow-up GHSA-fxqj-rqcc-2cmp: attacker-controlled
  #                    sourceMappingURL reads arbitrary .map files.
  #   sharp ^0.35.4    clears GHSA-rgj7-g3m4-5g8c (high, the bundled libheif
  #                    carries GHSA-g89c-p67h-r497 and -2jg2-4ch7-h545).
  #                    Pulled by nuxt-seo-utils > @nuxtjs/seo to resize OG
  #                    images at prerender time; same SSG reasoning as
  #                    image-size below, floored anyway because a patch
  #                    exists.
  #   shell-quote ^1.9.0
  #                    clears GHSA-395f-4hp3-45gv (high,
  #                    quadratic-complexity DoS in `parse()`).
  #   socket.io-parser ^4.2.7
  #                    clears GHSA-2m8v-j782-fhvr (high, zero-attachment
  #                    memory exhaustion). Pulled by socket.io-client >
  #                    @nuxt/content (docs site).
  #   svgo ^4.1.0      clears GHSA-w27v-7q3p-w38r (high, removeScripts lets
  #                    executable links through via namespace and
  #                    control-character bypasses) and GHSA-4vpr-x523-8j87
  #                    (incomplete sanitization of executable HTML inside
  #                    `foreignObject`), on top of the -2p49-hgcm-8545 high
  #                    the ^4.0.2 floor answered. Pulled by cssnano across
  #                    unbuild and the Nuxt vite builder.
  #   tar ^7.5.18      clears GHSA-w8wr-v893-vjvp (process crash via PAX
  #                    numeric path type confusion).
  #   undici ^7.29.0   clears GHSA-4cwx-7wf7-3272 (high, cross-user
  #                    disclosure + parse-time crash via degenerate private
  #                    cache directives) plus four mediums (CRLF injection,
  #                    cookie attribute injection, Cache-Control whitespace
  #                    disclosure, and retry-interceptor response
  #                    desynchronization) on top of the SOCKS5 ProxyAgent
  #                    and WebSocket-DoS highs the original ^7.28.0 floor
  #                    answered. Pulled by jsdom / cheerio (test harness).
  #   ws ^8.21.0       clears GHSA-96hv-2xvq-fx4p (high, memory-exhaustion
  #                    DoS from tiny fragments), auto-dismissed. Pulled by
  #                    socket.io-client > @nuxt/content (docs site).
  #
  # Deliberately not floored: image-size (GHSA-w3rx-r6r6-pgpr and
  # -5p2g-fcmc-qvqq, both high, infinite loops in the ICNS / JXL / HEIF
  # parsers) has no published patch. 2.0.2 is the newest release. It enters
  # the tree only through nuxt-seo-utils > @nuxtjs/seo, which calls it at
  # prerender time to size OG images committed to this repo, and the docs
  # site is pure SSG (`nitro.preset: 'static'`), so no runtime path feeds it
  # bytes at all. Both alerts are dismissed as tolerable risk on GitHub;
  # add a floor here the moment image-size ships one.
  '@tiptap/core': ^3.30.4
  'brace-expansion@^2': ^2.1.2
  'brace-expansion@^5': ^5.0.7
  esbuild: ^0.28.1
  fast-uri: ^3.1.6
  fflate: ^0.7.5
  fast-xml-parser: ^5.10.1
  js-yaml: ^4.3.2
  postcss: ^8.5.23
  sharp: ^0.35.4
  shell-quote: ^1.9.0
  socket.io-parser: ^4.2.7
  svgo: ^4.1.0
  tar: ^7.5.18
  undici: ^7.29.0
  ws: ^8.21.0

# Install-script allowlist. Any package NOT listed here has its
# install / postinstall / preinstall scripts skipped at install
# time. Mini-Shai-Hulud-style worms that ride a postinstall hook in
# a transitive dev dep are blocked structurally — only these six
# trusted packages (all have legitimate native-binary install needs)
# get to run scripts. Replaces the deprecated pnpm 10 setting
# `onlyBuiltDependencies` (different name, different shape).
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
