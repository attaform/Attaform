# Dependabot version updates.
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Two ecosystems are scanned:
#   - `npm` for runtime + dev dependencies (pnpm uses npm-compatible manifests).
#   - `github-actions` for workflow action versions (e.g. actions/checkout@v4).
#
# Dev-dep updates land as PRs against `main`; the usual CI gate (matrix.yml)
# runs `pnpm check`, so any update that breaks lint / typecheck / tests / size
# fails the PR and blocks auto-merge. Security advisories are filed separately
# by GitHub's native advisory scanner regardless of this schedule.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # Cap open PRs so a dep graph with many out-of-date packages doesn't
    # carpet-bomb the PR list. Security PRs are NOT counted against this cap.
    open-pull-requests-limit: 5
    # Cooldown delays a Dependabot PR until a new release has been on
    # the registry for the floor duration. Belt-and-braces over the
    # install-time cooldown declared in `.npmrc` (`minimumReleaseAge`):
    # `.npmrc` gates `pnpm install`, this gates whether Dependabot
    # even opens the PR. Together they defeat the "worm publishes,
    # downstream CI installs within the hour" failure mode that hit
    # TanStack Router in May 2026. Major bumps wait longer (highest-
    # risk upgrade class, rarely time-sensitive). Security PRs bypass
    # cooldown entirely, so critical CVEs still surface immediately.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Group non-security updates by kind so the review surface stays small.
    # Security updates are intentionally NOT grouped: each one gets its own
    # PR so the severity, advisory link, and upgrade blast radius are clear.
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      # `@vitest/coverage-v8` pins an EXACT vitest in its peers
      # (`"vitest": "5.0.0"` on 5.0.0), so the two can only move together.
      # Ungrouped, a major opens one PR per package and each is broken
      # alone: #653 offered coverage-v8 5.0.0 against vitest ^4.1.11, which
      # `strict-peer-dependencies=false` would have installed silently and
      # failed at `pnpm check:coverage`. Majors are listed here on purpose;
      # the two groups above deliberately cover only minor and patch.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
    # Conventional-commit scope is embedded in the prefix directly
    # (`chore(deps): …`, `chore(deps-dev): …`). Do NOT also set
    # `include: 'scope'`: Dependabot concatenates the two, producing
    # malformed `chore(deps)(deps): …` subjects that fail commitlint.
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    # Frozen by license, not by caution. PrimeVue 4.x is MIT; 5.0.0
    # (2026-07-15) relicensed the entire vendor cluster to
    # `SEE LICENSE IN LICENSE.md` and added a license manager, so it is
    # no longer OSI-licensed and cannot sit in an MIT library's tree.
    # The same relicense landed simultaneously on @primeuix/themes 3.0.0,
    # @primeuix/styles 3.0.0, @primeuix/styled 1.0.0, @primeuix/utils
    # 0.8.0 and @primevue/{core,icons} 5.0.0. That is PrimeTek's call to
    # make; ours is to stop tracking them. See the closed PR #559.
    #
    # 4.5.5 (2026-04-08) is the terminal 4.x release. npm's `v4-stable`
    # dist-tag points at it and nothing has shipped on the branch since.
    # So the manifests carry exact versions (`4.5.5`, `2.0.3`) rather
    # than carets. That is a different control from the `ignore` below,
    # not a duplicate of it: a caret would accept a back-ported 4.x
    # silently at install time, with no PR and nothing to review, while
    # the exact pin forces every move through a Dependabot PR where the
    # license gate and a human both get a look. The cluster edges are
    # already fenced by their own caret bounds (primevue depends on
    # @primeuix/utils `^0.6.2`, @primeuix/styled `^0.7.4`, @primeuix/styles
    # `^2.0.3`), none of which can reach a relicensed version.
    #
    # Patch updates stay OPEN on purpose. An outright ignore also
    # suppresses a dependency's Dependabot security PRs, and a security
    # back-port is the only 4.x release likely to appear now, which is
    # exactly the one worth having. Patch cannot cross into 5.x, so the
    # license refusal is untouched, and a 4.5.6 published under the new
    # terms would still fail dependency-review.yml's `allow-licenses`
    # gate the way #559 did. Major and minor are what get dropped: on a
    # branch this dead, both lead only to v5.
    #
    # Blast radius, for scale: PrimeVue is a devDependency of the root
    # package (which has no `dependencies` at all) and of the private
    # `attaform-site` app. It powers exactly one docs demo
    # (`docs-demos/third-party-primevue`) and the cross-library
    # `v-register` test matrix. It is absent from the published tarball
    # and never reaches a consumer install.
    #
    # Revisit if PrimeTek relicenses back to OSI terms, or when the
    # demo moves to a different batteries-included kit; deleting this
    # block and relaxing the pins is the whole undo.
    ignore:
      # Both zod specifiers in this repo are deliberate MAJOR pins, so a
      # major bump on either is never what we want. `apps/bench-arena` holds
      # `zod: ^3.25.76` beside `zod-v4: npm:zod@^4.4.3` because the arena
      # measures both lines, and every Zod-based row is only comparable
      # while they all carry the SAME Zod: results.json records
      # `validator: zod 3.25.76` on each, and #643 measured the shared floor
      # at 13.84 kB gz from it. #652 offered to move the 3.x pin to 4.6.2,
      # which would have changed every competitor's bundle number and
      # desynced the committed results from what produced them. Adopting a
      # new zod major is a deliberate project, not a dependabot PR.
      - dependency-name: 'zod'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'primevue'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@primeuix/themes'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    # No `.npmrc`-equivalent for action SHA pins, so this cooldown is
    # the ONLY release-age enforcement on the github-actions axis. A
    # 7-day floor catches actively-worming SHAs that surface in the
    # week after publish. `semver-major-days` is intentionally omitted:
    # Dependabot rejects it for the github-actions ecosystem because
    # action versions aren't modeled with strict semver-major
    # distinction. Security advisories bypass cooldown.
    cooldown:
      default-days: 7
    # `github/codeql-action/init` and `.../analyze` run in ONE job and the
    # action requires them to be the same version. Dependabot treats each
    # subpath as its own dependency, so ungrouped it opens a PR per subpath,
    # each bumping half of a matched pair: #647 and #651 both failed
    # `Analyze (javascript-typescript)` for that reason and neither could
    # have passed alone. `upload-sarif` joins the group because it is the
    # same release train, even though it lives in `scorecard.yml`.
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
    # Same pattern as the npm block: scope is in the prefix itself;
    # `include: 'scope'` is intentionally omitted to avoid a double scope.
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'dependencies'
      - 'github-actions'
