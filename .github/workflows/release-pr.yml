name: Prepare Release PR
run-name: ${{ github.event.inputs.exact_version != '' && format('Prepare v{0} release PR{1}', github.event.inputs.exact_version, github.event.inputs.dist_tag != '' && format(' @ {0}', github.event.inputs.dist_tag) || '') || format('Prepare {0} release PR', github.event.inputs.prerelease_id != '' && format('{0} ({1})', github.event.inputs.version_type, github.event.inputs.prerelease_id) || github.event.inputs.version_type) }}

# Step one of the two-workflow publish topology. This workflow opens a
# release PR with the version bump + CHANGELOG / RELEASES.md updates;
# `publish-npm.yml` (step two) fires on push to main once the PR merges
# and handles the actual npm publish + tag push + GitHub Release. Split
# so:
#
#   1. Branch updates to main always go through a PR. The
#      `main protection` ruleset on the repo gates main behind 10
#      required status checks + a `pull_request` rule with no bypass
#      actors; the old single-workflow approach (`git push --follow-tags`
#      back to main from the publish step) is structurally blocked.
#   2. The release-PR workflow runs install-script-free. It only needs
#      `pnpm version` (which doesn't read node_modules) + `gh`
#      (system binary) + Node (for `scripts/promote-changelog.mjs` +
#      `scripts/generate-release-notes.mjs`, both pure-Node). No GPG
#      key, no npm OIDC token, no `Production (NPM)` environment scope.
#      The privileged surface lives entirely in `publish-npm.yml`.
#   3. The bump commit is created via GitHub's `createCommitOnBranch`
#      GraphQL mutation, not `git commit && git push`. The resulting
#      commit is signed by `github-actions[bot]`'s web-flow key
#      (GitHub's server-side signing identity), which `required_signatures`
#      rulesets accept — no GPG key in this workflow.
#   4. The release PR itself is opened with a GitHub App installation
#      token, NOT the default `GITHUB_TOKEN`. GitHub Actions suppresses
#      cascading workflow runs when a `pull_request: opened` event is
#      triggered by `GITHUB_TOKEN`, so the required status checks
#      would never fire and the PR would sit pending forever. The App
#      credentials live in the `Production (Release PR)` deployment
#      environment (zizmor `secrets-outside-env` rule); the token is
#      minted per workflow run with `permission-pull-requests: write`
#      ONLY — even if the App's installation grants broader perms,
#      this token slice gets just enough to call `gh pr create`
#      (zizmor `github-app` rule). The action's built-in post-job
#      step revokes the token at end-of-job; combined with the API's
#      1-hour ceiling, the usable window is bounded by actual job
#      duration (~30s) rather than the API max.
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type (major, minor, patch). For prereleases, this is the base bump that the prerelease attaches to (used only when starting a NEW prerelease cycle). Ignored when `exact_version` is set.'
        required: true
        default: 'patch'
      prerelease_id:
        description: 'Prerelease identifier (alpha, beta, rc, next, ...). Leave EMPTY for a stable release. Example flow: 0.2.1 → 0.2.2-beta.0 → 0.2.2-beta.1 → 0.2.2. Ignored when `exact_version` is set.'
        required: false
        default: ''
      exact_version:
        description: 'Override mode: open a release PR for this EXACT semver (e.g. "1.16.3" or "1.16.3-hotfix.0") instead of computing from version_type / prerelease_id. Use for hotfixes to an older major line while a newer major holds the current `latest` tag. Pair with `dist_tag` so the publish does not clobber `latest`.'
        required: false
        default: ''
      dist_tag:
        description: 'npm dist-tag override. Leave EMPTY in normal flows — the workflow derives `latest` for stable releases and the preid for prereleases. Set this when publishing an off-latest version (e.g. "v1" for a v1.x hotfix while 2.x is current) so `npm install attaform` still resolves to the current major.'
        required: false
        default: ''
      target_branch:
        description: 'Branch to open the release PR against. Default `main` for normal releases; set to `hotfix/v<major>` (e.g. `hotfix/v0`) for off-latest hotfixes against an older major line.'
        required: false
        default: 'main'

# Workflow-level default: read-only. The `prepare` job below upgrades
# to `contents: write` + `pull-requests: write` for the createCommitOnBranch
# call + PR open. No `id-token`, no `attestations`, no environment
# scope — `release-pr.yml` runs without access to the GPG signing key
# or npm OIDC credential.
permissions:
  contents: read

# Serialize against the same target branch so two simultaneous dispatches
# don't both try to create `release/v<version>`. Different target branches
# (e.g. one against main + one against `hotfix/v0`) can run in parallel.
concurrency:
  group: release-pr-${{ github.event.inputs.target_branch || 'main' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    # The `Production (Release PR)` environment scopes the two App
    # secrets (`RELEASE_PR_APP_CLIENT_ID` + `RELEASE_PR_APP_PRIVATE_KEY`) to
    # this workflow and to dispatches from `main` / `hotfix/v*` (per
    # the environment's deployment-branches policy). zizmor's
    # `secrets-outside-env` rule flags privileged secrets accessed
    # from a job without an environment binding; the environment also
    # gives the credentials a separate audit trail from
    # `Production (NPM)` (publish-npm.yml's privileged surface), so a
    # compromise of one workflow does not escalate into the other's
    # secret pool.
    environment: Production (Release PR)
    permissions:
      contents: write # Create the `release/v<version>` branch ref + signed bump commit via `gh api` (createCommitOnBranch). Never writes to main directly.
      pull-requests: write # Open the release PR via `gh pr create`.
    steps:
      - name: Validate dispatch ref allowlist
        # workflow_dispatch picks up `github.ref` from the branch shown
        # in the dispatch UI. Restrict to `main` + `hotfix/v*` so a
        # dispatch from a random feature branch can't open a release PR
        # against an unintended base.
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main) ;;
            refs/heads/hotfix/v*) ;;
            *)
              echo "::error::Dispatching ref '$REF' is not allowed. release-pr.yml accepts dispatches from 'main' or 'hotfix/v*' only."
              exit 1
              ;;
          esac

      - name: Validate release-PR app credentials
        # `gh pr create` below MUST be called with a GitHub App
        # installation token, not `GITHUB_TOKEN`. GitHub Actions
        # suppresses cascading workflow runs when an event is triggered
        # by the default `GITHUB_TOKEN` — a PR opened with that token
        # fires the `pull_request: opened` event, but none of the
        # workflows listed under `on: pull_request` actually run for it.
        # The `main protection` ruleset requires 10 status checks;
        # without cascade the checks never fire and the PR is stuck
        # pending forever (the failure mode that swallowed v0.20.1's
        # first two release PRs, #321 and #323).
        #
        # See https://docs.github.com/en/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
        # for the underlying restriction.
        #
        # We use a GitHub App rather than a PAT because installation
        # tokens are short-lived (~1 hour), scoped to only the repos
        # the App is installed on, and carry a non-human service
        # identity. A PAT would be long-lived, tied to a human account,
        # and easily over-scoped — exactly the smells the rest of this
        # repo's release surface is built to avoid.
        #
        # Failing here, before any state on origin is mutated, keeps
        # the remote tidy: no orphan branch, no half-opened PR.
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_PR_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_CLIENT_ID:-}" ] || [ -z "${APP_PRIVATE_KEY:-}" ]; then
            echo "::error title=Release-PR app credentials missing::This workflow requires a GitHub App installation for opening the release PR."
            echo "::error::Setup:"
            echo "::error::  1. Create the App: https://github.com/organizations/attaform/settings/apps/new"
            echo "::error::     - GitHub App name: attaform-release (or any unique name)"
            echo "::error::     - Homepage URL: https://github.com/attaform/Attaform"
            echo "::error::     - Disable Webhook (uncheck Active)"
            echo "::error::     - Repository permissions: Pull requests=Write (Metadata=Read auto-included)"
            echo "::error::     - Where can this GitHub App be installed?: Only on this account"
            echo "::error::     - Create GitHub App"
            echo "::error::  2. On the new app's settings page:"
            echo "::error::     - Note the Client ID near the top of General (starts with 'Iv23li...')"
            echo "::error::     - Generate a private key (.pem download) at the bottom"
            echo "::error::  3. Install the app on this repo only: Install App tab -> attaform org -> Only select repositories -> attaform/Attaform -> Install"
            echo "::error::  4. Create the deployment environment: https://github.com/attaform/Attaform/settings/environments/new"
            echo "::error::     - Name: Production (Release PR) (exactly, matching the workflow's environment: key)"
            echo "::error::     - Deployment branches and tags: Selected branches -> add 'main' and 'hotfix/v*'"
            echo "::error::     - No required reviewers, no wait timer"
            echo "::error::  5. Add the two secrets to the environment (NOT to repo-level secrets):"
            echo "::error::     - RELEASE_PR_APP_CLIENT_ID: the Client ID from step 2 (starts with 'Iv23li...')"
            echo "::error::     - RELEASE_PR_APP_PRIVATE_KEY: the full contents of the .pem file (BEGIN to END inclusive)"
            echo "::error::  6. Re-dispatch this workflow."
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.target_branch }}
          # Full history needed by `generate-release-notes.mjs` to walk
          # `git tag --sort=-creatordate` for the previous release.
          fetch-depth: 0
          # Drop GITHUB_TOKEN from `.git/config` after checkout. The
          # release branch + bump commit are written via `gh api`
          # (createCommitOnBranch), not `git push`; remote branch
          # existence + orphan-SHA reads also go through `gh api`
          # (see the Classify step). The working tree never needs an
          # attached credential, so the token in `.git/config` would
          # be unnecessary ambient authority — zizmor flags this under
          # the `artipacked` rule.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          # Disable setup-node's package-manager-cache. We never run
          # `pnpm install` in this workflow — `pnpm version` only edits
          # package.json and runs the `version` lifecycle hook (which
          # calls pure-Node scripts). No node_modules surface to cache.
          package-manager-cache: false

      - name: Calculate next version
        id: calculate-next-version
        env:
          # Bind the inputs into env vars so the `run:` block references
          # them as ordinary shell variables — eliminates the GitHub
          # Actions template-injection footprint without a suppression
          # comment.
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          PRERELEASE_ID: ${{ github.event.inputs.prerelease_id }}
          EXACT_VERSION: ${{ github.event.inputs.exact_version }}
        run: |
          set -euo pipefail

          # Classify the dispatch shape. Precedence matches the version
          # computation below: explicit exact_version wins, else
          # prerelease_id wins (any base bump it carries is implicit in
          # the prerelease cycle), else fall back to version_type.
          # Surfaced as a step output so downstream commit headline + PR
          # title can encode the bump shape (e.g.
          # `chore(release/patch): v0.20.2`), giving publish-npm.yml's
          # run-name a parse-free signal of the release type via
          # `github.event.head_commit.message`.
          if [ -n "$EXACT_VERSION" ]; then
            BUMP_TYPE=exact
          elif [ -n "$PRERELEASE_ID" ]; then
            BUMP_TYPE=prerelease
          else
            BUMP_TYPE="$VERSION_TYPE"
          fi
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

          # exact_version short-circuit: caller dictates the version
          # verbatim, skipping version_type / prerelease_id math. Used
          # for hotfix releases to older major lines (e.g. opening a PR
          # for 1.16.3 while 2.x is current). Pair with `dist_tag` so the
          # off-latest tarball does not shadow the current `latest`.
          if [ -n "$EXACT_VERSION" ]; then
            if ! echo "$EXACT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$'; then
              echo "::error::exact_version='$EXACT_VERSION' is not a valid semver string. Examples: 1.16.3, 1.16.3-hotfix.0"
              exit 1
            fi
            CURRENT=$(node -p "require('./package.json').version")
            if [ "$EXACT_VERSION" = "$CURRENT" ]; then
              echo "::error::exact_version='$EXACT_VERSION' matches the current package.json version — pnpm version would reject the bump. Pick a distinct version or use a regular bump path."
              exit 1
            fi
            echo "next_version=$EXACT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Computed in Node so we can handle prerelease semantics without
          # depending on `semver` being installed. Pure-JS version inc,
          # matching `semver.inc`:
          #
          #   stable + no preid    → bump <type>           e.g. 0.13.0 → 0.13.1
          #   stable + preid       → pre<type> + .0        e.g. 0.13.0 → 0.13.1-beta.0
          #   prerelease + no preid → drop suffix          e.g. 0.13.1-beta.5 → 0.13.1
          #   prerelease + same preid → bump counter       e.g. 0.13.1-beta.5 → 0.13.1-beta.6
          #   prerelease + new preid → switch preid, .0    e.g. 0.13.1-beta.5 → 0.13.1-rc.0
          #
          # version_type is consulted ONLY when starting a new prerelease
          # cycle from stable. Once you're inside a prerelease cycle, base
          # bumps are deferred until you exit (run with empty prerelease_id
          # then bump separately, or pass version_type=patch which drops
          # the suffix without re-bumping).
          NEXT=$(node -e '
            const v = require("./package.json").version;
            const type = process.env.VERSION_TYPE;
            const preid = process.env.PRERELEASE_ID;
            const m = v.match(/^(\d+)\.(\d+)\.(\d+)(?:-([\w.-]+?)(?:\.(\d+))?)?$/);
            if (!m) { console.error("Unparseable version: " + v); process.exit(1); }
            let [, maj, min, pat, curId, curN] = m;
            maj = +maj; min = +min; pat = +pat;
            curN = curN === undefined ? null : +curN;
            const onPrerelease = curId !== undefined;
            const bumpBase = (t) => {
              if (t === "major") { maj++; min = 0; pat = 0; }
              else if (t === "minor") { min++; pat = 0; }
              else { pat++; }
            };
            let next;
            if (preid) {
              if (onPrerelease) {
                if (curId === preid && curN !== null) {
                  next = `${maj}.${min}.${pat}-${preid}.${curN + 1}`;
                } else {
                  next = `${maj}.${min}.${pat}-${preid}.0`;
                }
              } else {
                bumpBase(type);
                next = `${maj}.${min}.${pat}-${preid}.0`;
              }
            } else {
              if (onPrerelease) {
                next = `${maj}.${min}.${pat}`;
              } else {
                bumpBase(type);
                next = `${maj}.${min}.${pat}`;
              }
            }
            console.log(next);
          ')
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Compute resolved dist-tag
        id: compute-dist-tag
        env:
          DIST_TAG_INPUT: ${{ github.event.inputs.dist_tag }}
          PRERELEASE_ID: ${{ github.event.inputs.prerelease_id }}
        run: |
          set -euo pipefail
          # Resolution order: explicit `dist_tag` input wins; else
          # `<preid>` for prereleases; else `latest`. publish-npm.yml
          # reads this value back from `package.json#publishConfig.tag`
          # to drive both `pnpm publish` and the GitHub Release
          # `make_latest` flag.
          if [ -n "${DIST_TAG_INPUT:-}" ]; then
            TAG="$DIST_TAG_INPUT"
          elif [ -n "${PRERELEASE_ID:-}" ]; then
            TAG="$PRERELEASE_ID"
          else
            TAG="latest"
          fi
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump version + promote changelog
        # `pnpm version <X> --no-git-tag-version` writes the new version
        # into package.json and fires the `version` npm-hook
        # (promote-changelog.mjs + generate-release-notes.mjs +
        # sync-doc-versions.mjs + a `git add` of CHANGELOG.md, RELEASES.md,
        # and the version-stamped scorecard doc). The `--no-git-tag-version`
        # flag suppresses the auto-commit AND the auto-tag — the staged
        # files stay in the index, where the Stage bump step finalizes
        # the index for createCommitOnBranch consumption.
        #
        # RELEASE_NOTES_TARGET_REF is consumed by generate-release-notes.mjs
        # when calling `gh api .../generate-notes` — for hotfix releases
        # against a non-main branch, this drives the PR-range correctly.
        env:
          NEXT_VERSION: ${{ steps.calculate-next-version.outputs.next_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_TARGET_REF: ${{ github.event.inputs.target_branch }}
        run: |
          set -euo pipefail
          pnpm version "$NEXT_VERSION" --no-git-tag-version

      - name: Set publishConfig.tag
        # Surgical string-level edit to preserve the rest of package.json
        # byte-for-byte (matching how `pnpm version` itself edits the
        # version field). Re-serializing via JSON.stringify would risk
        # drifting against the repo's Prettier rule on package.json.
        # Anchored to the `publishConfig` block so we never touch an
        # unrelated key literally named `tag` elsewhere.
        env:
          DIST_TAG: ${{ steps.compute-dist-tag.outputs.dist_tag }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = "package.json";
            const src = fs.readFileSync(path, "utf8");
            const tag = process.env.DIST_TAG;
            const match = src.match(/("publishConfig"\s*:\s*\{[^}]*?"tag"\s*:\s*")[^"]*(")/);
            if (!match) {
              console.error("Could not locate publishConfig.tag in package.json — abort.");
              process.exit(1);
            }
            const updated = src.replace(match[0], `${match[1]}${tag}${match[2]}`);
            fs.writeFileSync(path, updated);
            console.log(`publishConfig.tag set to "${tag}"`);
          '

      - name: Stage bump
        run: |
          set -euo pipefail
          # `pnpm version` staged CHANGELOG.md + RELEASES.md + the
          # version-stamped scorecard doc (via the `version` hook's
          # `git add` step) and modified package.json in the working tree
          # without staging it. The publishConfig.tag edit above only
          # touches package.json. Stage package.json explicitly so the
          # index reflects every bump change for createCommitOnBranch
          # below.
          #
          # No local commit. The signed commit is produced by the
          # `Create signed bump commit` step via createCommitOnBranch
          # against this same staged set.
          git add package.json

          # Defense in depth: createCommitOnBranch below builds its
          # additions from exactly this staged set, so assert the set
          # before it becomes a commit. CHANGELOG.md, RELEASES.md, and
          # package.json are always part of a bump. The docs that
          # sync-doc-versions.mjs stamps ride along only when their
          # version marker is present; that script is deliberately
          # tolerant and skips a re-worded doc, so they are allowed but
          # not required. Any path outside this allow-list fails the
          # release here, where the run log still shows what was modified.
          STAGED=$(git diff --cached --name-only | sort)
          REQUIRED=$(printf '%s\n' CHANGELOG.md RELEASES.md package.json | sort)
          ALLOWED=$(printf '%s\n' \
            CHANGELOG.md \
            RELEASES.md \
            package.json \
            docs/scorecard/cii-best-practices-answers.md | sort)
          MISSING=$(comm -23 <(printf '%s\n' "$REQUIRED") <(printf '%s\n' "$STAGED"))
          UNEXPECTED=$(comm -13 <(printf '%s\n' "$ALLOWED") <(printf '%s\n' "$STAGED"))
          if [ -n "$MISSING" ] || [ -n "$UNEXPECTED" ]; then
            echo "::error::Release commit staging invariant violated."
            if [ -n "$MISSING" ]; then
              printf '%s\n' "$MISSING" | sed '/^$/d; s/^/::error::  missing required file: /'
            fi
            if [ -n "$UNEXPECTED" ]; then
              printf '%s\n' "$UNEXPECTED" | sed '/^$/d; s/^/::error::  unexpected staged file: /'
            fi
            echo "::error::Required: CHANGELOG.md, RELEASES.md, package.json. Also allowed: docs/scorecard/cii-best-practices-answers.md"
            exit 1
          fi
          echo "Files staged for release commit:"
          echo "$STAGED"

      - name: Classify dispatch state
        id: classify
        # Two modes:
        #
        #   (1) mode=fresh. The terminal mode for every re-dispatch path
        #       that does NOT have an open release PR. Covers:
        #
        #         a. No branch on origin (first dispatch for this version).
        #         b. Orphan branch on origin (no open PR pointing at it).
        #            Could be a prior dispatch that died before opening
        #            the PR, a closed-without-merge PR, or a stale branch
        #            from a workflow version that produced a different
        #            tree than this run will. The branch is deleted
        #            here; the `Create signed bump commit` step below
        #            re-creates it from scratch.
        #
        #       Deleting + re-creating is also the defense against a
        #       malicious actor pre-staging `release/v<next>` with a
        #       backdoored tree: their branch is obliterated before our
        #       createCommitOnBranch call runs, so the workflow only
        #       ever publishes a tree it computed itself. The earlier
        #       "byte-match or fail" design refused to publish on a tree
        #       mismatch, but that path required the user to delete the
        #       branch by hand on every divergence — including benign
        #       cases like the GitHub auto-notes API returning slightly
        #       different markdown between runs.
        #
        #   (2) mode=noop. The release branch has an open PR. The prior
        #       dispatch already landed everything; this dispatch
        #       discards its local bump and exits cleanly without
        #       touching the branch (which would invalidate the open PR).
        #
        # `base_sha` is captured for the createCommitOnBranch
        # `expectedHeadOid` field below. HEAD has not moved since
        # checkout (no local commit), so it is target_branch's tip at
        # the moment the workflow started — the right parent for the
        # signed bump commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.calculate-next-version.outputs.next_version }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          BRANCH="release/v$NEXT_VERSION"
          BASE_SHA=$(git rev-parse HEAD)
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          # Remote branch existence + orphan-SHA reads go through the
          # API rather than `git ls-remote`. With `persist-credentials:
          # false` on the checkout there is no token attached to
          # `.git/config`; `gh api` uses the explicit `GH_TOKEN` env
          # binding instead, which keeps the credential out of the
          # working tree (zizmor `artipacked` rule).
          #
          # `gh api -i` prints the HTTP status line + headers + body on
          # stdout. Classify on the parsed status code, never on "is the
          # output non-empty": a 404 body is an error JSON (not an empty
          # string), so an `[ -z "$body" ]` check would misread "absent"
          # as "orphan".
          #
          # The probe is retried on a transient GitHub failure (5xx, 429,
          # or an empty body from a dropped connection). A release
          # dispatch has to survive an API blip rather than hard-fail on
          # it; only a sustained outage exits, and with an actionable
          # message. The status line is read with a here-string, not
          # `echo "$RAW" | head`, so a large 5xx error page cannot trip
          # SIGPIPE under `pipefail` and mask the real status behind a
          # "Broken pipe".
          HTTP_STATUS=""
          RAW=""
          ATTEMPTS=5
          for attempt in $(seq 1 "$ATTEMPTS"); do
            set +e
            RAW=$(gh api -i "repos/$GH_REPOSITORY/branches/$BRANCH" 2>/dev/null)
            set -e
            read -r _ HTTP_STATUS _ <<< "$RAW" || true

            case "${HTTP_STATUS:-}" in
              200)
                # Branch exists. Continue to PR / orphan classification.
                # awk consumes all of "$RAW", so there is no early-close
                # SIGPIPE the way `head` would create.
                BRANCH_BODY=$(printf '%s\n' "$RAW" | awk 'body{print} /^\r?$/{body=1}')
                break
                ;;
              404)
                echo "mode=fresh" >> "$GITHUB_OUTPUT"
                echo "::notice title=Fresh dispatch::$BRANCH does not exist on origin; creating the branch + signed bump commit via createCommitOnBranch and opening the PR."
                exit 0
                ;;
              429 | 5?? | "")
                if [ "$attempt" -lt "$ATTEMPTS" ]; then
                  BACKOFF=$((attempt * 5))
                  echo "::warning title=Retrying branch probe::Attempt $attempt/$ATTEMPTS got status '${HTTP_STATUS:-(no response)}' from the branches API; retrying in ${BACKOFF}s."
                  sleep "$BACKOFF"
                  continue
                fi
                echo "::error::Branch-existence probe still failing after $ATTEMPTS attempts (last status: ${HTTP_STATUS:-(no response)}). GitHub's API is likely degraded; re-dispatch once it recovers."
                exit 1
                ;;
              *)
                echo "::error::Unexpected HTTP status checking branch existence: ${HTTP_STATUS:-(no response)}"
                printf '%s\n' "$RAW"
                exit 1
                ;;
            esac
          done

          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            PR_URL="${GH_SERVER_URL}/${GH_REPOSITORY}/pull/${PR_NUMBER}"
            echo "mode=noop" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release PR already open::PR #$PR_NUMBER for $BRANCH is open at $PR_URL; discarding local bump and exiting."
            exit 0
          fi

          # Orphan branch: exists on origin without an open PR. Delete
          # it so the `Create signed bump commit` step can re-create it
          # cleanly. Closed PRs that referenced this branch keep their
          # commit object reachable via `refs/pull/<n>/head`, so the
          # audit trail of the prior attempt is preserved even with
          # the branch ref gone.
          ORPHAN_SHA=$(echo "$BRANCH_BODY" | jq -r .commit.sha)
          echo "::notice title=Cleaning up orphan branch::$BRANCH exists on origin (sha=$ORPHAN_SHA) without an open PR; deleting before re-creating with a fresh signed bump commit."
          gh api -X DELETE "repos/$GH_REPOSITORY/git/refs/heads/$BRANCH"
          echo "mode=fresh" >> "$GITHUB_OUTPUT"

      - name: Create signed bump commit
        if: steps.classify.outputs.mode == 'fresh'
        # `createCommitOnBranch` produces a commit signed by
        # `github-actions[bot]` via GitHub's server-side web-flow key.
        # The resulting commit is "Verified" in the GitHub UI and
        # satisfies the `main protection` ruleset's `required_signatures`
        # rule on merge — no GPG key in this workflow.
        #
        # The mutation requires its target branch to already exist, so
        # the branch ref is created first (pointing at the
        # target_branch tip captured by the Classify step). The bump
        # files (package.json, CHANGELOG.md, RELEASES.md) are passed as
        # base64-encoded `additions` that the API overlays onto the
        # base commit's tree to produce the new commit's tree.
        #
        # The branch ref creation will fail with HTTP 422 if the branch
        # already exists. The Classify step above guarantees absence:
        # `mode == 'fresh'` means either the branch never existed or
        # the orphan-cleanup step just deleted it.
        #
        # Variables are read from env, not interpolated by the shell or
        # by Actions templating. The script uses execFileSync (not
        # execSync) so each argument is passed as its own argv element;
        # this keeps the call shell-free end-to-end.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.calculate-next-version.outputs.next_version }}
          BUMP_TYPE: ${{ steps.calculate-next-version.outputs.bump_type }}
          DIST_TAG: ${{ steps.compute-dist-tag.outputs.dist_tag }}
          BASE_SHA: ${{ steps.classify.outputs.base_sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");

            const version = process.env.NEXT_VERSION;
            const bumpType = process.env.BUMP_TYPE;
            const distTag = process.env.DIST_TAG;
            const baseSha = process.env.BASE_SHA;
            const repo = process.env.GH_REPOSITORY;
            const tmp = process.env.RUNNER_TEMP;
            const branch = `release/v${version}`;

            // Create the release branch ref on origin, pointing at the
            // target_branch tip captured by the Classify step.
            execFileSync(
              "gh",
              [
                "api",
                "-X", "POST",
                `repos/${repo}/git/refs`,
                "-f", `ref=refs/heads/${branch}`,
                "-f", `sha=${baseSha}`,
              ],
              { stdio: "inherit" }
            );

            // Read + base64-encode every file in the release commit.
            // The set is whatever the Stage bump step staged and
            // asserted: package.json, CHANGELOG.md, RELEASES.md, plus any
            // version-stamped docs. Building `additions` from the index
            // keeps this step in lock-step with that assertion, so a new
            // stamp target can never silently fall off the commit.
            const staged = execFileSync("git", [
              "diff", "--cached", "--name-only", "-z",
            ])
              .toString("utf8")
              .split("\0")
              .filter(Boolean);
            const encode = (path) =>
              fs.readFileSync(path).toString("base64");
            const additions = staged.map((path) => ({
              path,
              contents: encode(path),
            }));

            // Build the GraphQL request body. The mutation is wrapped
            // around a single `$input: CreateCommitOnBranchInput!`
            // variable so jq / shell quoting do not need to massage
            // nested objects.
            const requestBody = JSON.stringify({
              query: `mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid url }
                }
              }`,
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: repo,
                    branchName: branch,
                  },
                  message: {
                    headline: `chore(release/${bumpType}): v${version}`,
                    body: `Bumps the package to v${version} (${bumpType}) with \`publishConfig.tag=${distTag}\`. Promotes the CHANGELOG Unreleased section and prepends a RELEASES.md entry. When merged, \`publish-npm.yml\` runs an idempotent precheck and publishes \`attaform@${version}\` to npm under the \`${distTag}\` dist-tag.`,
                  },
                  expectedHeadOid: baseSha,
                  fileChanges: { additions },
                },
              },
            });

            const requestPath = `${tmp}/createCommitOnBranch.json`;
            fs.writeFileSync(requestPath, requestBody);
            execFileSync(
              "gh",
              ["api", "graphql", "--input", requestPath],
              { stdio: "inherit" }
            );
          '

      - name: Build PR body
        if: steps.classify.outputs.mode != 'noop'
        # Build the PR body to a file via Node (no shell interpolation)
        # rather than a heredoc with dispatch-input interpolation —
        # eliminates the template-injection footprint that a heredoc
        # `<<EOF` block with `$DIST_TAG` / `$NEXT_VERSION` would
        # carry. The body is read by `gh pr create --body-file` below.
        env:
          NEXT_VERSION: ${{ steps.calculate-next-version.outputs.next_version }}
          DIST_TAG: ${{ steps.compute-dist-tag.outputs.dist_tag }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          PRERELEASE_ID: ${{ github.event.inputs.prerelease_id }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const version = process.env.NEXT_VERSION;
            const distTag = process.env.DIST_TAG;
            const target = process.env.TARGET_BRANCH || "main";
            const preid = process.env.PRERELEASE_ID || "";
            const isPrerelease = preid !== "";
            const makesLatest = distTag === "latest" && !isPrerelease;
            const body = [
              `## Release v${version}`,
              "",
              "Mechanical version-bump PR opened by `release-pr.yml`. Merging this PR triggers `publish-npm.yml` to publish `attaform@" + version + "` to npm under the `" + distTag + "` dist-tag.",
              "",
              "| Detail | Value |",
              "|---|---|",
              "| Version | `" + version + "` |",
              "| npm dist-tag | `" + distTag + "` |",
              "| Prerelease | " + (isPrerelease ? "yes (preid: `" + preid + "`)" : "no") + " |",
              "| Target branch | `" + target + "` |",
              "| Make-latest | " + (makesLatest ? "yes" : "no") + " |",
              "",
              "### What changed",
              "",
              "- `package.json`: version bumped, `publishConfig.tag` set to `" + distTag + "`",
              "- `CHANGELOG.md`: `## Unreleased` promoted to `## v" + version + "`",
              "- `RELEASES.md`: auto-generated GitHub release-notes entry prepended",
              "- `docs/scorecard/cii-best-practices-answers.md`: `current:` version marker stamped to `" + version + "`",
              "",
              "### After merge",
              "",
              "`publish-npm.yml` runs an idempotent precheck:",
              "",
              "1. `npm view attaform@" + version + "`: publishes if missing",
              "2. `git ls-remote --tags origin v" + version + "`: pushes tag if missing",
              "3. `gh release view v" + version + "`: creates GitHub Release if missing",
              "",
              "Re-running the workflow after a successful publish is safe (noop).",
              "",
            ].join("\n");
            const out = path.join(process.env.RUNNER_TEMP, "pr-body.md");
            fs.writeFileSync(out, body);
            console.log("Wrote PR body to " + out);
          '
          echo "PR_BODY_PATH=$RUNNER_TEMP/pr-body.md" >> "$GITHUB_ENV"

      - name: Ensure release-pr label exists
        if: steps.classify.outputs.mode != 'noop'
        # `gh pr create --label` rejects unknown labels with
        # `could not add label: 'release-pr' not found`, which would
        # require a one-time `gh label create` against the repo before
        # the workflow could open its first PR. `--force` makes this
        # idempotent: first run creates, every run after no-op-updates
        # color + description. Self-bootstrapping the label keeps the
        # workflow free of out-of-repo prerequisites.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create release-pr \
            --description "Mechanical version-bump PR opened by release-pr.yml" \
            --color 0E8A16 \
            --force

      - name: Mint release-PR app installation token
        if: steps.classify.outputs.mode != 'noop'
        id: app_token
        # Mints a fresh installation token for the release-PR GitHub
        # App. GitHub's API mints these with a fixed 1-hour ceiling on
        # lifetime; the action's built-in post-job step calls
        # `DELETE /installation/token` at end-of-job (default
        # `skip-token-revoke: false`), shrinking the usable window from
        # the API's 1-hour ceiling down to actual job duration (~30s
        # for this workflow).
        #
        # The token carries the App's identity (not
        # `github-actions[bot]`), so the `pull_request: opened` event
        # the next step fires escapes the GITHUB_TOKEN cascade
        # restriction.
        #
        # `permission-pull-requests: write` is the only permission the
        # token is scoped to — the App on install may hold broader
        # permissions, but this token slice gets just enough to call
        # `gh pr create` (zizmor `github-app` rule: do not inherit
        # blanket installation permissions).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Open release PR
        if: steps.classify.outputs.mode != 'noop'
        # GH_TOKEN here is the App installation token from the previous
        # step, NOT `secrets.GITHUB_TOKEN`. PRs opened via `GITHUB_TOKEN`
        # do not cascade workflow runs, so the 10 required status checks
        # would never fire — see the `Validate release-PR app
        # credentials` step at the top of this job for the rationale.
        # Everything else in this workflow (branch ref creation, signed
        # bump commit, label bootstrap) runs on the lower-privilege
        # default `GITHUB_TOKEN`.
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          NEXT_VERSION: ${{ steps.calculate-next-version.outputs.next_version }}
          BUMP_TYPE: ${{ steps.calculate-next-version.outputs.bump_type }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        run: |
          set -euo pipefail
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "release/v$NEXT_VERSION" \
            --title "chore(release/$BUMP_TYPE): v$NEXT_VERSION" \
            --label "release-pr" \
            --body-file "$PR_BODY_PATH"
