name: Node.js Test Suite

permissions:
  contents: read
  actions: read # Read other workflow runs so branch-protection rules can cross-reference status. Read-only; no API write surface.

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# Cancel superseded runs on the same ref. When a follow-up commit
# lands while CI is still running, the older run is killed — only
# the latest commit's status matters for review. Saves wasted
# compute on force-push / rapid push cycles.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job topology — designed for parallelism, no redundant work:
#   - Version-agnostic checks (lint, typecheck, size, bench, coverage,
#     build-site) each run ONCE on a single Node version, in parallel.
#     They have no Node-version sensitivity — running them on a matrix
#     would 3× the compute for no signal.
#   - Cross-Node coverage lives in the `test` matrix: it runs ONLY
#     `pnpm test`, on `lts/*` (the auto-rotating current LTS, 22.x
#     today). The `engines.node` floor is >=22 (Node 20 is EOL) with
#     no upper bound, so newer Node majors stay supported without a
#     workflow edit.
#
# Wall-clock time = max(slowest single-Node job, slowest matrix
# shard). The previous `pnpm check` matrix had each Node version
# re-running every step (including the Node-version-agnostic ones),
# pushing the critical path to ~5min. Splitting brings it to ~2min.
#
# When adding a new check to `pnpm check`, ALSO add a corresponding
# job here. `pnpm check` stays the single source-of-truth command
# for local dev; CI fans the same set out into independent jobs.
#
# Cache strategy — every job uses `actions/cache/restore` (read-only)
# + `actions/cache/save` (write, main-push only). Three things matter:
#
#   1. The unified `actions/cache` action saves on every run. PR runs
#      saving to a key shared with `main` would let a malicious PR
#      poison the cache that subsequent `main` runs restore — a
#      variant of the cross-ref cache poisoning vector that hit
#      TanStack Router (2026-05-11). Splitting restore/save and
#      gating save on `github.ref == 'refs/heads/main'` closes that.
#
#   2. `restore-keys:` (prefix fallback) is deliberately absent.
#      Prefix-fallback restore is the other half of the poisoning
#      vector — if a stale `main` cache exists under a partial-match
#      key, it would be restored into a PR run that didn't pin the
#      lockfile-hash exact key. Exact-key-only restore means a
#      lockfile change always cold-installs. PR-CI runs that bump
#      deps pay +60-90s; the trade is worth it.
#
#   3. The save step is additionally gated on
#      `cache-hit != 'true'` so we don't re-upload an unchanged
#      blob on every `main` push.

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Drop GITHUB_TOKEN from .git/config after checkout. CI-only
          # job; no `git push` or private-ref fetch needs the token
          # attached to the working tree.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache (read-only)
        id: pnpm-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache (main-push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-restore.outputs.cache-primary-key }}

      # Generate apps/site/.nuxt/imports.d.ts so the eslint config can
      # parse Nuxt's auto-imports (`computed`, `useState`, etc.) and
      # `no-undef` doesn't false-fail on auto-imported names.
      - name: Prepare Nuxt auto-imports
        run: pnpm dev:prepare

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Drop GITHUB_TOKEN from .git/config after checkout. CI-only
          # job; no `git push` or private-ref fetch needs the token
          # attached to the working tree.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache (read-only)
        id: pnpm-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache (main-push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-restore.outputs.cache-primary-key }}

      - name: Stub attaform (Nuxt + site types)
        run: pnpm dev:prepare

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 20 dropped after its 2026-04-30 EOL — concurrent with
        # the pnpm 10 → 11 bump, which itself requires Node 22+ to
        # run. The package's `engines.node` was raised to >=22.0.0
        # in the same change.
        #
        # Single-row matrix: `lts/*` is the auto-rotating current-LTS
        # canary (today 22.x; when Node 24 ships LTS the canary
        # jumps with no config change). Listing 22.x explicitly
        # alongside `lts/*` would be redundant today and would freeze
        # us at "previous LTS" the moment a new one ships.
        node-version: ['lts/*']
      fail-fast: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Drop GITHUB_TOKEN from .git/config after checkout. CI-only
          # job; no `git push` or private-ref fetch needs the token
          # attached to the working tree.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache (read-only)
        id: pnpm-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache (main-push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-restore.outputs.cache-primary-key }}

      - name: Stub attaform (Nuxt + site types)
        run: pnpm dev:prepare

      - name: Run tests
        run: pnpm test

  size:
    name: Bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Drop GITHUB_TOKEN from .git/config after checkout. CI-only
          # job; no `git push` or private-ref fetch needs the token
          # attached to the working tree.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache (read-only)
        id: pnpm-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache (main-push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-restore.outputs.cache-primary-key }}

      # `pnpm check:size` runs `pnpm prepack` (unbuild) before
      # invoking size-limit, so we don't need a separate prepack
      # step here.
      - name: Check bundle size
        run: pnpm check:size

      # Verifies the published `.d.ts` shape compiles a representative
      # 4-form `useStepper` pattern under `tsc`. Acceptance test for
      # the type-system depth-efficiency refactor — if this fails,
      # consumers wiring multiple forms in one scope will trip
      # TS2589 ("Type instantiation is excessively deep").
      - name: Check bundled types
        run: pnpm check:bundled-types

  bench:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Drop GITHUB_TOKEN from .git/config after checkout. CI-only
          # job; no `git push` or private-ref fetch needs the token
          # attached to the working tree.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache (read-only)
        id: pnpm-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache (main-push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-restore.outputs.cache-primary-key }}

      - name: Stub attaform
        run: pnpm dev:prepare

      - name: Run benchmarks
        run: pnpm check:bench

  build-site:
    name: Build docs site
    runs-on: ubuntu-latest
    # The docs site is a downstream consumer of attaform — building
    # it catches site-level regressions (broken markdown link, REPL
    # bundler choke on a src/ change) at PR time. Node-version
    # agnostic: a single LTS run is enough; the test matrix covers
    # the cross-version surface.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Drop GITHUB_TOKEN from .git/config after checkout. CI-only
          # job; no `git push` or private-ref fetch needs the token
          # attached to the working tree.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache (read-only)
        id: pnpm-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache (main-push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-restore.outputs.cache-primary-key }}

      - name: Stub attaform (Nuxt + site types)
        run: pnpm dev:prepare

      - name: Build docs site
        run: pnpm build:site

  coverage-artifact:
    name: Publish coverage HTML artifact
    runs-on: ubuntu-latest
    # Independent of the test matrix — this exists so PR reviewers
    # can open the coverage report in a browser without checking out
    # the branch and running the suite locally. Uses
    # `pnpm check:coverage` (vitest with coverage instrumentation),
    # which also fails the job if coverage thresholds drop.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Drop GITHUB_TOKEN from .git/config after checkout. CI-only
          # job; no `git push` or private-ref fetch needs the token
          # attached to the working tree.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js (lts)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache (read-only)
        id: pnpm-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache (main-push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ steps.pnpm-restore.outputs.cache-primary-key }}

      - name: Stub attaform
        run: pnpm dev:prepare

      - name: Run coverage
        run: pnpm check:coverage

      - name: Upload coverage HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14
