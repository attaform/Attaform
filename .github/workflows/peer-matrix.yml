name: Peer-Dep Matrix

# Weekly sweep across the peer-dep surface. The README claims support for
# Nuxt 3/4 and Vue 3.5+ (with Vite 5/6). This workflow enforces that claim
# by installing each supported combination and running the core quality
# gate (typecheck + test + size-limit) against it.
#
# Scope:
#   - Node runtime: pinned to 22.x so the matrix isolates peer variance.
#     The main `matrix.yml` workflow covers the auto-rotating current LTS.
#   - Version pinning uses `pnpm.overrides` injected before install so the
#     pin propagates across the whole dep graph (transitive resolutions
#     follow the override too, which is the point of peer-dep testing).
#   - Combinations are listed explicitly via `include:` rather than
#     cartesian product to avoid known-invalid pairings (Nuxt 4 needs
#     Vite ≥6; some Nuxt/Vue pairs are incompatible).
#   - `fail-fast: false` lets every combination report independently.
#     Missing future versions (e.g. Vue 3.6 before release) surface as
#     failed jobs in the Actions tab — informational, not blocking.
#
# Scheduling:
#   - Cron: Monday 06:00 UTC weekly. Not wired into PR checks; bench +
#     transient peer-version flakiness would be needlessly noisy on every
#     PR, and nothing merging to main changes the peer-dep axis.
#   - `workflow_dispatch` for manual runs before releases.

permissions:
  contents: read
  actions: read # Read other workflow runs so branch-protection rules can cross-reference status. Read-only; no API write surface.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Serialize the weekly sweep across cron + manual dispatch. A second
# run starting mid-sweep would re-resolve pnpm.overrides against a
# scratch package.json that the first run already mutated.
concurrency:
  group: peer-matrix
  cancel-in-progress: false

jobs:
  peer-matrix:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor: the declared peer-dep minimums.
          - label: floor — Vue 3.5.13 / Vite 5 / Nuxt 3.16
            vue: 3.5.13
            vite: ^5.0.0
            nuxt: ^3.16.0
          # Vite 6 over the Vue 3.5 floor — confirms no Vite 6-specific
          # regressions in the core that would surprise Vite 6 adopters
          # still on Vue 3.5.
          - label: Vue 3.5 latest / Vite 6 / Nuxt 3 latest
            vue: ^3.5.0
            vite: ^6.0.0
            nuxt: ^3.0.0
          # Ceiling of the Vue 3.x line with the current Nuxt 3 line.
          - label: Vue 3.6 / Vite 6 / Nuxt 3 latest
            vue: ^3.6.0
            vite: ^6.0.0
            nuxt: ^3.0.0
          # Nuxt 4 — the README claims 3/4 parity, and this pairing is
          # what a Nuxt 4 adopter would actually install.
          - label: Vue 3.6 / Vite 6 / Nuxt 4
            vue: ^3.6.0
            vite: ^6.0.0
            nuxt: ^4.0.0

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Drop GITHUB_TOKEN from .git/config after checkout. This job
          # only runs typecheck + test + size against re-resolved deps;
          # it never pushes or fetches a private ref.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x

      - name: Inject pnpm-workspace.yaml overrides for this matrix cell
        env:
          # Bind matrix values into env vars so the `node -e` script
          # below reads them via `process.env` rather than YAML
          # template-interpolating them into a shell-then-node parse
          # chain. Matrix values are workflow-defined (not attacker-
          # controlled), but env-binding eliminates the lower-confidence
          # template-injection finding without leaving a suppression
          # comment behind.
          MATRIX_VUE: ${{ matrix.vue }}
          MATRIX_VITE: ${{ matrix.vite }}
          MATRIX_NUXT: ${{ matrix.nuxt }}
        run: |
          # pnpm 11 no longer reads the `pnpm` field in package.json, so
          # the per-cell pins go into pnpm-workspace.yaml — the new home
          # for `overrides` (https://pnpm.io/settings). Injecting into
          # package.json instead would be silently ignored, leaving the
          # matrix testing default-resolved versions rather than the
          # pinned cell. The pins merge into the committed `overrides`
          # block (whose `@nuxt/*: $nuxt` aliases then follow the `nuxt`
          # pin injected here). No YAML library is installed at this
          # step, so insert the three keys with a built-in text edit
          # rather than a parse/serialize round-trip.
          node -e '
          const fs = require("fs");
          const file = "./pnpm-workspace.yaml";
          const lines = fs.readFileSync(file, "utf8").split("\n");
          const at = lines.findIndex((l) => /^overrides:[ \t]*$/.test(l));
          if (at === -1) throw new Error("no overrides: block found in pnpm-workspace.yaml");
          const pins = [
            "  vue: " + process.env.MATRIX_VUE,
            "  vite: " + process.env.MATRIX_VITE,
            "  nuxt: " + process.env.MATRIX_NUXT,
          ];
          lines.splice(at + 1, 0, ...pins);
          fs.writeFileSync(file, lines.join("\n"));
          console.log("applied overrides:", pins.join(", "));
          '

      - name: Install with overrides
        # --no-frozen-lockfile: the override mutation invalidates the
        # committed pnpm-lock.yaml; we deliberately re-resolve against the
        # overridden range here. The lockfile change is scratch (never
        # committed from this runner).
        run: pnpm install --no-frozen-lockfile

      - name: Stub attaform
        run: pnpm dev:prepare

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Size limit
        run: pnpm check:size
